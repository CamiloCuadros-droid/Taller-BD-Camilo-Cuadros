<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Register</title>

</head>
<body>
  <h1>Register</h1>
  <form id="registerForm">
    <label for="regUsername">Username:</label><br>
    <input type="text" id="regUsername" name="username" required><br><br>
    <label for="regPassword">Password:</label><br>
    <input type="password" id="regPassword" name="password" required><br><br>
    <button type="submit">Register</button>
  </form>
  <p id="registerResult"></p>

  <hr>

  <h1>Login</h1>
  <form id="loginForm">
    <label for="logUsername">Username:</label><br>
    <input type="text" id="logUsername" name="username" required><br><br>
    <label for="logPassword">Password:</label><br>
    <input type="password" id="logPassword" name="password" required><br><br>
    <button type="submit">Login</button>
  </form>
  <p id="loginResult"></p>

  <script>
    // ==== Register ====
    const registerForm = document.getElementById("registerForm");
    const registerResult = document.getElementById("registerResult");

    registerForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("regUsername").value;
      const password = document.getElementById("regPassword").value;

      try {
        const res = await fetch("/sql/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        const text = await res.text();
        registerResult.textContent = text;
      } catch (err) {
        registerResult.textContent = "Error connecting to server.";
      }
    });

    // ==== Login ====
    const loginForm = document.getElementById("loginForm");
    const loginResult = document.getElementById("loginResult");

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("logUsername").value;
      const password = document.getElementById("logPassword").value;

      try {
        const res = await fetch("/sql/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        const text = await res.text();
        loginResult.textContent = text;
      } catch (err) {
        loginResult.textContent = "Error connecting to server.";
      }
    });
  </script>
</body>
</html>
